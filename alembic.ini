# Alembic config. The database URL comes from app settings (DATABASE_URL / .env),
# unless a caller sets `sqlalchemy.url` programmatically (tests do).
[alembic]
script_location = %(here)s/app/db/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os
